<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G4 Games</title>
    <link rel="icon" type="image/png" href="assets/g4games_title_logo.png">
    <meta name="description" content="One-man studio building mobile games 🎮">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-circle-1"></div>
        <div class="glow-circle-2"></div>
    </div>

    <main class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="logo-container">
                <img src="assets/g4games_logo.png" alt="G4 Games Logo" class="main-logo">
            </div>
            <p class="bio">One-man studio building mobile games 🎮</p>
            <div class="social-links">
                <a href="https://www.instagram.com/g4gameshq/" class="social-btn" aria-label="Instagram" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://x.com/g4gameshq" class="social-btn" aria-label="Twitter" target="_blank">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
            </div>
        </header>

        <!-- Games Section -->
        <section class="games-section">
            <h2 class="section-title">Games</h2>
            
            <div class="games-grid">
                <!-- Game 1 -->
                <div class="game-card">
                    <div class="game-image bg-game-1"></div>
                    <div class="game-content">
                        <h3 class="game-title">My Village Resort</h3>
                        <p class="game-desc">Manage your resort, welcome your guest, build your dream village!</p>
                        <div class="store-links">
                            <a href="#" class="store-btn apple" aria-label="App Store'dan İndir">
                                <i class="fab fa-apple"></i>
                                <span class="btn-text">
                                    <span class="btn-small">Download on the</span>
                                    <span class="btn-large">App Store</span>
                                </span>
                            </a>
                            <a href="#" class="store-btn google" aria-label="Google Play'den Al">
                                <i class="fab fa-google-play"></i>
                                <span class="btn-text">
                                    <span class="btn-small">GET IT ON</span>
                                    <span class="btn-large">Google Play</span>
                                </span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Game 2 -->
                
                
                
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-links">
                <a href="privacy-policy.html" class="footer-link">Privacy Policy</a>
                <span class="divider">•</span>
                <a href="terms-of-use.html" class="footer-link">Terms of Use</a>
            </div>
            <p class="copyright">© 2026 G4 Games. Tüm hakları saklıdır.</p>
        </footer>
    </main>
</body>
</html>
